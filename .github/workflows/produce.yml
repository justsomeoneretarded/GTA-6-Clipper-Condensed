name: Produce GTA VI Condensed Gameplay

on:
  workflow_dispatch:
  schedule:
    - cron: '47 9 * * *'

permissions:
  contents: write

jobs:
  produce:
    uses: justsomeoneretarded/GTA-6-Clipper-shorts/.github/workflows/editor.yml@main
    with:
      mode: condensed
      engine: justsomeoneretarded/GTA-6-Clipper-shorts
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
